[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-tracker"
version = "0.1.0"
description = "A Codeforces problem tracking and analytics tool"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
include = ["cf_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
